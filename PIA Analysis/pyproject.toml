[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piaa"
version = "0.3.31"
description = "PIA Analysis - Project Innovation Approach Analysis for the World Bank Group lending portfolio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "json_repair>=0.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
semantic = ["sentence-transformers>=2.2"]   # embedding backend for pattern matching (piaa/patterns/r2)

[project.scripts]
piaa = "piaa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["piaa*"]

[tool.setuptools.package-data]
piaa = ["workflows/*/*.yaml", "workflows/*/*.html", "workflows/*/*.md", "workflows/*/prompts/*.md", "patterns/*/*.yaml", "patterns/*/*.html", "patterns/*/*.md", "patterns/*/prompts/*.md", "webapp/static/*"]
